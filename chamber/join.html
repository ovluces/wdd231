  </header>
  <main>
    <h1>Join</h1>
    <form method="get" action="thankyou.html" id="form" class="form">
      <fieldset>
        <legend>Applicant information</legend>
        <label>First Name*<input type="text" name="fname" autocomplete="given-name" title="First Name" required></label>
        <label>Last Name*<input type="text" name="lname" autocomplete="family-name" title="Last Name" required></label>
        <label>Organizational Title*<input type="text" id="organizationalTitle" name="organization-title"
            title="Organizational Title" autocomplete="organization-title" required></label>
        <label>email*<input type="email" name="email" placeholder="someone@email.com" autocomplete="email" title="email"
            required></label>
        <label>Phone*<input type="tel" name="phone" autocomplete="tel" placeholder="1235551234" title="Phone"
            required></label>
        <label>Business / Organization Name*<input type="text" name="businessName" autocomplete="organization"
            title="Business / Organization Name" required></label>
      </fieldset>
      <fieldset>
        <legend>Membership Level*</legend>
        <label><input type="radio" name="membership" value="np" required>NP Membership</label>
        <label><input type="radio" name="membership" value="bronze">Bronze Membership</label>
        <label><input type="radio" name="membership" value="silver">Silver Membership</label>
        <label><input type="radio" name="membership" value="gold">Gold Membership</label>
      </fieldset>

      <fieldset>
        <legend>Other</legend>
        <label>Business/Organization's Description
          <textarea id="descripcion" name="descripcion" title="Business/Organization's Description"></textarea></label>
        <input type="hidden" name="timestamp" id="timestampField">

      </fieldset>
      <input type="submit" value="Send Application">

    </form>

    <h2>Membership Level</h2>
    <article class="gridWeather" id="datos">
